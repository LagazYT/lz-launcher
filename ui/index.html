<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LZ Launcher</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="features.css">
<link rel="stylesheet" href="tv.css">
<link rel="stylesheet" href="trophies.css">
<link rel="stylesheet" href="themes.css">
<link rel="stylesheet" href="theme-cyberpunk.css">
<link rel="stylesheet" href="theme-midnight.css">
<link rel="stylesheet" href="theme-xbox.css">
<script>try { document.documentElement.dataset.theme = localStorage.getItem("lz_theme") || "sober"; } catch (e) { }</script>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="wordmark"><img src="icon.png" alt=""><span>LZ Launcher</span><div class="wm-score" id="wm-score"></div></div>

    <nav class="nav" id="nav">
      <div class="nav-label" data-i18n="Biblioteca">Biblioteca</div>
      <button class="nav-item" data-nav="all" data-i18n-title="Todos os jogos"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg><span data-i18n="Todos os jogos">Todos os jogos</span><em id="count-all">0</em></button>
      <button class="nav-item" data-nav="recompiled" data-i18n-title="Recompilados"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1"/><path d="M9 9h6v6H9zM9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></svg><span data-i18n="Recompilados">Recompilados</span><em id="count-recompiled">0</em></button>
      <button class="nav-item" data-nav="normal" data-i18n-title="Jogos de PC"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13" rx="1"/><path d="M8 21h8M12 17v4"/></svg><span data-i18n="Jogos de PC">Jogos de PC</span><em id="count-normal">0</em></button>

      <div class="nav-label" data-i18n="Coleções">Coleções</div>
      <button class="nav-item" data-col="favorites" data-i18n-title="Favoritos"><svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9Z"/></svg><span data-i18n="Favoritos">Favoritos</span><em id="count-favorites">0</em></button>
      <button class="nav-item" data-col="recent" data-i18n-title="Jogados recentemente"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span data-i18n="Jogados recentemente">Jogados recentemente</span><em id="count-recent">0</em></button>
      <button class="nav-item" data-col="hidden" data-i18n-title="Ocultos"><svg viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.1A9.8 9.8 0 0 1 12 5c5 0 9 4.5 10 7a13 13 0 0 1-2.9 4M6.6 6.6C4.5 8 2.9 10 2 12c1 2.5 5 7 10 7 1.6 0 3-.4 4.3-1"/></svg><span data-i18n="Ocultos">Ocultos</span><em id="count-hidden">0</em></button>

      <div class="nav-label" data-i18n="Você">Você</div>
      <button class="nav-item" data-page="stats" data-i18n-title="Estatísticas"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span data-i18n="Estatísticas">Estatísticas</span></button>
      <button class="nav-item" data-page="trophies" data-i18n-title="Conquistas"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0Z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg><span data-i18n="Conquistas">Conquistas</span></button>
    </nav>

    <div class="now-playing" id="now-playing" hidden></div>
    <div class="update-card" id="update-card" hidden></div>

    <div class="sidebar-foot">
      <button class="side-btn" id="btn-tv" data-i18n-title="Modo TV (tela cheia, para controle) · F11"><svg viewBox="0 0 24 24"><path d="M6 9h4M8 7v4M15 10h.01M18 8h.01M6.5 5h11a4.5 4.5 0 0 1 4.4 5.4l-1 5A3 3 0 0 1 16 17l-2-2h-4l-2 2a3 3 0 0 1-4.9-1.6l-1-5A4.5 4.5 0 0 1 6.5 5Z"/></svg><span data-i18n="Modo TV">Modo TV</span></button>
      <div class="menu-wrap">
        <button class="side-btn" id="btn-add" data-i18n-title="Adicionar jogos"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="Adicionar jogos">Adicionar jogos</span></button>
        <div class="menu" id="menu-add" hidden>
          <button data-act="add-folder"><b data-i18n="Adicionar pasta de jogos">Adicionar pasta de jogos</b><small data-i18n="Reconhece os jogos da pasta automaticamente">Reconhece os jogos da pasta automaticamente</small></button>
          <button data-act="add-exe"><b data-i18n="Adicionar jogo pelo executável">Adicionar jogo pelo executável</b><small data-i18n="Escolha o .exe de um jogo">Escolha o .exe de um jogo</small></button>
        </div>
      </div>
      <button class="side-btn" id="btn-settings" data-i18n-title="Configurações"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg><span data-i18n="Configurações">Configurações</span></button>
      <div class="version" id="app-version"></div>
    </div>
  </aside>

  <main class="content">
    <div class="ambient" aria-hidden="true"></div>
    <!-- Biblioteca -->
    <section id="library-view" class="view">
      <header class="lib-head">
        <div class="lib-title"><h1 id="view-title">Todos os jogos</h1><span id="view-sub"></span></div>
        <div class="lib-tools">
          <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" type="search" data-i18n-placeholder="Buscar" placeholder="Buscar" autocomplete="off"></label>
          <select id="sort" class="select" data-i18n-title="Ordenar">
            <option value="name" data-i18n="Nome">Nome</option>
            <option value="recent" data-i18n="Última vez jogado">Última vez jogado</option>
            <option value="playtime" data-i18n="Tempo de jogo">Tempo de jogo</option>
            <option value="added" data-i18n="Data de adição">Data de adição</option>
            <option value="platform" data-i18n="Plataforma">Plataforma</option>
          </select>
          <div class="seg" id="view-toggle" data-i18n-title="Modo de exibição">
            <button data-view="grid" data-i18n-title="Grade"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></button>
            <button data-view="list" data-i18n-title="Lista"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button>
          </div>
          <input id="size" type="range" min="120" max="260" step="10" data-i18n-title="Tamanho das capas">
          <button class="tool-btn" id="btn-rescan" data-i18n-title="Procurar jogos novos"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
        </div>
      </header>
      <div id="scanbar" class="scanbar" hidden><span class="spinner"></span><span id="scan-msg"></span></div>
      <div class="scroller" id="scroller">
        <section id="spotlight" class="spotlight" hidden></section>
        <section id="grid" class="grid"></section>
        <section id="list" class="list" hidden></section>
        <section id="empty" class="empty" hidden></section>
      </div>
    </section>

    <!-- Estatísticas -->
    <section id="stats-view" class="view" hidden>
      <header class="lib-head">
        <div class="lib-title"><h1 data-i18n="Estatísticas">Estatísticas</h1><span data-i18n="Seu tempo de jogo em números">Seu tempo de jogo em números</span></div>
      </header>
      <div class="scroller"><div id="stats-body" class="stats"></div></div>
    </section>

    <!-- Conquistas -->
    <section id="trophies-view" class="view" hidden>
      <header class="lib-head">
        <div class="lib-title"><h1 data-i18n="Conquistas">Conquistas</h1><span data-i18n="Troféus da PSN e conquistas dos seus jogos">Troféus da PSN e conquistas dos seus jogos</span></div>
      </header>
      <div class="scroller"><div id="trophies-body" class="stats"></div></div>
    </section>

    <!-- Detalhes -->
    <section id="details" class="view details" hidden>
      <div class="hero" id="d-heroWrap">
        <img id="d-hero" alt="">
        <button class="back" id="d-back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg><span data-i18n="Voltar">Voltar</span></button>
        <div class="hero-title"><h1 id="d-title"></h1><div id="d-sub" class="hero-sub"></div></div>
      </div>
      <div class="actionbar">
        <button class="btn play" id="d-play"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5Z"/></svg><span>Jogar</span></button>
        <div class="quick" id="d-quick"></div>
        <div class="spacer"></div>
        <button class="btn" id="d-alt" hidden data-i18n-title="Abre o launcher/configurações do próprio port"><span data-i18n="Launcher do port">Launcher do port</span></button>
        <button class="btn icon" id="d-fav" data-i18n-title="Favorito"><svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9Z"/></svg></button>
        <button class="btn icon" id="d-folder" data-i18n-title="Abrir pasta do jogo"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg></button>
        <button class="btn icon" id="d-art" data-i18n-title="Trocar capa ou imagem de fundo"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg></button>
        <button class="btn icon" id="d-edit" data-i18n-title="Editar"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
      </div>
      <div class="d-body">
        <div class="d-cover" id="d-cover"></div>
        <div class="d-main">
          <div class="d-section">
            <h3><span data-i18n="Sobre o jogo">Sobre o jogo</span><button class="mini-btn" id="d-info-refresh" data-i18n-title="Buscar as informações de novo"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button></h3>
            <div id="d-info" class="d-info"></div>
          </div>
          <div class="d-section" id="d-trophies-sec" hidden>
            <h3><span id="d-trophies-title">Conquistas</span><button class="mini-btn" id="d-trophies-refresh" data-i18n-title="Buscar a lista de novo"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button></h3>
            <div id="d-trophies"></div>
          </div>
          <div class="d-section">
            <h3 data-i18n="Histórico de sessões">Histórico de sessões</h3>
            <div id="d-sessions"></div>
          </div>
          <div class="d-section">
            <h3 data-i18n="Informações">Informações</h3>
            <dl class="d-meta" id="d-meta"></dl>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Modo TV -->
  <section id="tv" class="tv" hidden>
    <div class="tv-bg"><img alt=""><img alt=""><video id="tv-video" muted loop playsinline></video></div>
    <canvas id="tv-fx" class="tv-fx" hidden></canvas>
    <div class="tv-shade"></div>
    <header class="tv-top">
      <div class="tv-logo"><img src="icon.png" alt=""><div class="tv-who"><span>LZ Launcher</span><small class="tv-score" id="tv-score"></small></div></div>
      <nav class="tv-icons" id="tv-icons"></nav>
      <div class="tv-search" id="tv-search-chip"></div>
      <div class="tv-right"><span id="tv-battery"></span><span class="tv-clock" id="tv-clock"></span><button class="tv-exit" id="tv-exit" data-i18n-title="Sair do Modo TV"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    </header>
    <div class="tv-info" id="tv-info"></div>
    <div class="tv-rows" id="tv-rows"></div>
    <footer class="tv-hints" id="tv-hints"></footer>
    <div class="tv-overlay" id="tv-overlay" hidden></div>
  </section>

  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <header><h2 id="modal-title"></h2><button class="tool-btn" id="modal-close" data-i18n-title="Fechar"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></header>
      <div id="modal-body" class="modal-body"></div>
      <footer id="modal-foot"></footer>
      <div class="modal-grip" id="modal-grip" data-i18n-title="Arraste para redimensionar · clique duas vezes para voltar ao tamanho padrão"></div>
    </div>
  </div>
  <div id="tip" class="tip" hidden></div>
  <div id="toasts" class="toasts"></div>
</div>
<script src="i18n.js"></script>
<script src="app.js"></script>
<script src="tv.js"></script>
<script src="trophies.js"></script>
</body>
</html>
